name: Build
on: [push, pull_request]
jobs:
  arm-checks:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libgles-dev libegl-dev libgbm-dev libdrm-dev
      - name: Build
        run: make -j2 all tool neogpu_pong neogpu_pong_ai neogpu_capture_demo neogpu_procgame
      - name: Headless contracts
        run: make test
      - name: Compile every C source with warnings as errors
        run: make check-sources
      - name: Portable intrinsics fallback
        run: make check-scalar
      - name: Legacy benchmark still builds
        run: make bench_legacy
      - name: Memory and undefined-behavior checks
        run: make sanitize
      - name: Race checks
        run: make tsan
